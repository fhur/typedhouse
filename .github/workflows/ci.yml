name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        typescript: ['5.5.4', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Keep the build tool's legacy compiler dependency stable: TS 7 removed
      # its JS compiler API. All type assertions use each matrix CLI instead.
      - run: pnpm --package typescript@${{ matrix.typescript }} dlx tsc --noEmit
      - run: pnpm check:all
        env:
          CHQL_TYPESCRIPT_VERSION: ${{ matrix.typescript }}
