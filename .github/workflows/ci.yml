name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # One root program type-checks every source and test file; it needs more than
      # Node's ~4 GB default heap (4.23 GB measured at da46b13). Runners have 16 GB.
      NODE_OPTIONS: --max-old-space-size=8192
    strategy:
      fail-fast: false
      matrix:
        typescript: ['5.5.4', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Keep the build tool's legacy compiler dependency stable: TS 7 removed
      # its JS compiler API. All type assertions use each matrix CLI instead.
      - run: pnpm --package typescript@${{ matrix.typescript }} dlx tsc --noEmit
      - run: pnpm check:all
        env:
          TYPEDHOUSE_TYPESCRIPT_VERSION: ${{ matrix.typescript }}
