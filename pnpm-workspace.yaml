packages:
  - packages/*
  - apps/*
onlyBuiltDependencies:
  - esbuild
# Dev-only transitive security fixes (root devDependency testcontainers 12.2.1 ->
# archiver ^7, the newest range testcontainers accepts). No direct upgrade reaches them:
# - archiver-utils 5.0.2 (latest) pins glob ^10 (GHSA-3g3m-2fjr-6pw4, fixed in glob 14.0.2;
#   glob 14 brings minimatch ^11, fixing GHSA-g3hv-75wg-m249). archiver-utils only calls
#   glob.sync(pattern, options), which glob 14's CommonJS build still exports.
# - readdir-glob 1.1.3 (under archiver 7) pins minimatch ^5 (GHSA-g3hv-75wg-m249, fixed in
#   minimatch 11.0.1). It only uses `new Minimatch(pattern, options).match(...)`, unchanged
#   in minimatch 11's CommonJS build.
# Remove when testcontainers moves to archiver >= 8 with fixed transitive ranges.
overrides:
  archiver-utils>glob: ^14.0.3
  readdir-glob>minimatch: ^11.0.4
# See patches/README.md (Docker Desktop for Mac dynamic TCP ports; upstream PR #1602 still open).
patchedDependencies:
  testcontainers@12.2.1: patches/testcontainers@12.2.1.patch
